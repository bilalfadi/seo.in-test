name: Render and compare original vs Cloudflare preview
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/visual-compare.mjs
      - .github/workflows/visual-compare.yml
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/visual-compare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seogroupbuy-rendered-visual-comparison
          path: visual-audit/
          if-no-files-found: ignore

